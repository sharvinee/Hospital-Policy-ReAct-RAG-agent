[project]
name = "hospital-policy"
version = "0.2.0"
description = "A Creat Agent-powered RAG assistant for LangChain documentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.4.0",
    "langchain>=1.0.0",
    "langchain-chroma>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph-api>=0.17.1",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.0",
]

[tool.uv]
package = false
